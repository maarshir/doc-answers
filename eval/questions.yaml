# Вопросы к примерам документов из examples/docs.
# source: файл, где лежит ответ; facts: что обязано быть в ответе модели.
# answerable: false для вопросов, ответа на которые в документах нет:
# модель должна честно сказать об этом, а не придумать.

- id: vacation_days
